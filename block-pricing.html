<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сравнение тарифов</title>
<style>
/* ============================================================
   СРАВНЕНИЕ ТАРИФОВ / КОМПЛЕКТАЦИЙ
   Один файл. Без библиотек. Цвет: --brand. Шрифт: от сайта.
   ============================================================ */
:root{
  --brand:#2D5BFF;
  --brand-soft:#EEF2FF;
  --ink:#111827;
  --muted:#6B7280;
  --line:#E5E7EB;
  --card:#FFFFFF;
  --bg:#F9FAFB;
  --off:#9CA3AF;
}
*{box-sizing:border-box;}
.pr{
  font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);
  background:var(--bg);border-radius:14px;padding:clamp(20px,4vw,36px);
  max-width:1060px;margin:0 auto;
}
.pr *{font-family:inherit;}
.pr__head{text-align:center;margin-bottom:24px;}
.pr__title{font-size:clamp(21px,3.4vw,29px);font-weight:700;letter-spacing:-.015em;margin:0 0 8px;}
.pr__sub{font-size:15px;color:var(--muted);margin:0;}

/* period toggle */
.toggle{display:flex;justify-content:center;margin:20px 0 26px;}
.toggle__inner{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px;}
.toggle button{
  cursor:pointer;border:none;background:none;border-radius:8px;
  padding:9px 17px;font-size:14px;font-weight:600;color:var(--muted);
  transition:background .15s,color .15s;
}
.toggle button[aria-pressed="true"]{background:var(--brand);color:#fff;}
.toggle button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
.toggle .save{font-size:11.5px;font-weight:700;opacity:.85;margin-left:5px;}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr);}}
@media(max-width:620px){.cards{grid-template-columns:1fr;}}

.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:22px 20px;position:relative;display:flex;flex-direction:column;
  transition:border-color .15s,box-shadow .15s;
}
.card:hover{border-color:#C7CDD8;}
.card--hot{border-color:var(--brand);box-shadow:0 8px 26px rgba(45,91,255,.12);}
.card__flag{
  position:absolute;top:-11px;left:50%;transform:translateX(-50%);
  background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;padding:5px 13px;border-radius:20px;white-space:nowrap;
}
.card__name{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:6px 0 12px;}
.card__spec{font-size:14px;color:var(--muted);margin:0 0 14px;}
.card__spec b{color:var(--ink);font-weight:600;}
.price{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px;}
.price__now{font-size:clamp(25px,3.4vw,32px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.price__was{font-size:15px;color:var(--off);text-decoration:line-through;font-variant-numeric:tabular-nums;}
.price__per{font-size:13px;color:var(--muted);margin:0 0 18px;}
.benefit{
  display:inline-block;font-size:12.5px;font-weight:700;color:#B45309;background:#FEF3C7;
  padding:4px 10px;border-radius:6px;margin-bottom:16px;
}
.card__cta{
  display:block;text-align:center;cursor:pointer;text-decoration:none;
  padding:13px 16px;font-size:14.5px;font-weight:600;border-radius:10px;
  transition:filter .15s,transform .06s,background .15s;margin-bottom:18px;
}
.card__cta--solid{background:var(--brand);color:#fff;border:1.5px solid var(--brand);}
.card__cta--solid:hover{filter:brightness(1.08);}
.card__cta--ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line);}
.card__cta--ghost:hover{border-color:var(--brand);background:var(--brand-soft);}
.card__cta:active{transform:translateY(1px);}
.card__cta:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

.feats{list-style:none;padding:0;margin:0;display:grid;gap:9px;border-top:1px solid var(--line);padding-top:16px;}
.feats li{display:flex;gap:9px;align-items:flex-start;font-size:14px;}
.feats svg{width:16px;height:16px;flex:none;margin-top:3px;}
.feats li.off{color:var(--off);}
/* mobile collapse */
.more{
  display:none;background:none;border:none;cursor:pointer;margin-top:14px;
  font-size:13.5px;font-weight:600;color:var(--brand);padding:6px 0;
}
.more:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px;}
@media(max-width:620px){
  .more{display:block;}
  .feats{display:none;}
  .card.open .feats{display:grid;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body style="margin:0;background:#F0F2F5;padding:24px 12px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">

<div class="pr">
  <div class="pr__head">
    <h2 class="pr__title" id="p-title"></h2>
    <p class="pr__sub" id="p-sub"></p>
  </div>
  <div class="toggle" id="toggle"></div>
  <div class="cards" id="cards"></div>
</div>

<!-- ↓ подпись демонстрации. При передаче клиенту эти 3 строки удалить. -->
<p style="max-width:1060px;margin:16px auto 0;text-align:center;font-size:13px;color:#6B7280;">
  Блок сделал Павел · <a href="https://t.me/chrnshvpa" style="color:#2D5BFF;font-weight:600;text-decoration:none;">t.me/chrnshvpa</a>
</p>

<script>
/* ============================================================
   НАСТРОЙКА
   ============================================================ */
const CONFIG = {
  title: "Выберите тариф",
  subtitle: "Можно перейти на другой в любой момент — доплата по разнице.",
  currency: "₽",

  /* два периода; discount — скидка второго в % (0 = выключить переключатель) */
  periods: [
    { name:"Месяц", per:"в месяц", mult:1,  discount:0  },
    { name:"Год",   per:"в месяц при оплате за год", mult:12, discount:20 }
  ],

  plans: [
    {
      name:"Базовый",
      spec:"До <b>3</b> проектов",
      price:2900,
      cta:"Выбрать",
      features:[
        { text:"3 активных проекта",       on:true },
        { text:"Базовая аналитика",        on:true },
        { text:"Поддержка по почте",       on:true },
        { text:"Совместная работа",        on:false },
        { text:"Выгрузка отчётов",         on:false },
        { text:"Персональный менеджер",    on:false }
      ]
    },
    {
      name:"Рабочий",
      spec:"До <b>15</b> проектов",
      price:5900,
      hot:true,
      flag:"Выбирают чаще",
      cta:"Выбрать",
      features:[
        { text:"15 активных проектов",     on:true },
        { text:"Расширенная аналитика",    on:true },
        { text:"Поддержка в чате",         on:true },
        { text:"Совместная работа, до 5 человек", on:true },
        { text:"Выгрузка отчётов",         on:true },
        { text:"Персональный менеджер",    on:false }
      ]
    },
    {
      name:"Команда",
      spec:"<b>Без ограничений</b>",
      price:12900,
      cta:"Выбрать",
      features:[
        { text:"Проекты без ограничений",  on:true },
        { text:"Расширенная аналитика",    on:true },
        { text:"Поддержка в чате, 24/7",   on:true },
        { text:"Совместная работа без лимита", on:true },
        { text:"Выгрузка отчётов",         on:true },
        { text:"Персональный менеджер",    on:true }
      ]
    }
  ]
};

/* ---------- реализация ---------- */
(function(){
  "use strict";
  const $=id=>document.getElementById(id);
  let period=0;
  const fmt=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n))+' '+CONFIG.currency;
  const yes='<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="var(--brand)" opacity=".13"/><path d="M4.6 8.3l2.2 2.2L11.4 5.9" stroke="var(--brand)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const no ='<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="#9CA3AF" opacity=".13"/><path d="M5.4 5.4l5.2 5.2M10.6 5.4l-5.2 5.2" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round"/></svg>';

  $('p-title').textContent=CONFIG.title;
  $('p-sub').textContent=CONFIG.subtitle;

  function buildToggle(){
    const t=$('toggle');
    const usable=CONFIG.periods.length>1;
    if(!usable){ t.style.display='none'; return; }
    t.innerHTML='<div class="toggle__inner" role="group" aria-label="Период оплаты">'+
      CONFIG.periods.map((p,i)=>
        '<button type="button" data-i="'+i+'" aria-pressed="'+(i===period)+'">'+p.name+
        (p.discount?'<span class="save">−'+p.discount+'%</span>':'')+'</button>'
      ).join('')+'</div>';
    t.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      period=+b.dataset.i; buildToggle(); buildCards();
    }));
  }

  function buildCards(){
    const p=CONFIG.periods[period];
    $('cards').innerHTML=CONFIG.plans.map((pl,i)=>{
      const full=pl.price;
      const now = p.discount ? full*(1-p.discount/100) : full;
      const saveYear = p.discount ? (full-now)*12 : 0;
      return '<div class="card'+(pl.hot?' card--hot':'')+'" data-i="'+i+'">'+
        (pl.flag?'<span class="card__flag">'+pl.flag+'</span>':'')+
        '<div class="card__name">'+pl.name+'</div>'+
        '<p class="card__spec">'+pl.spec+'</p>'+
        '<div class="price"><span class="price__now">'+fmt(now)+'</span>'+
          (p.discount?'<span class="price__was">'+fmt(full)+'</span>':'')+'</div>'+
        '<p class="price__per">'+p.per+'</p>'+
        (saveYear?'<span class="benefit">Выгода '+fmt(saveYear)+' за год</span>':'')+
        '<a class="card__cta '+(pl.hot?'card__cta--solid':'card__cta--ghost')+'" href="#order">'+pl.cta+'</a>'+
        '<button class="more" type="button">Что входит ↓</button>'+
        '<ul class="feats">'+pl.features.map(f=>
          '<li class="'+(f.on?'':'off')+'">'+(f.on?yes:no)+'<span>'+f.text+'</span></li>'
        ).join('')+'</ul>'+
      '</div>';
    }).join('');

    document.querySelectorAll('.more').forEach(b=>b.addEventListener('click',()=>{
      const c=b.closest('.card'); const open=c.classList.toggle('open');
      b.textContent = open ? 'Свернуть ↑' : 'Что входит ↓';
      report();
    }));
    report();
  }

  /* --- цвет бренда --- */
  function setBrand(hex){
    if(!/^#?[0-9a-fA-F]{6}$/.test(hex))return;
    hex='#'+hex.replace('#','');
    document.documentElement.style.setProperty('--brand',hex);
    document.documentElement.style.setProperty('--brand-soft',hex+'14');
  }
  const q0=new URLSearchParams(location.search).get('brand');
  if(q0) setBrand(q0);
  window.addEventListener('message',e=>{ if(e.data&&e.data.type==='brand') setBrand(String(e.data.value)); });

  /* --- высота для iframe --- */
  let last=0;
  function report(){
    const h=document.documentElement.scrollHeight;
    if(Math.abs(h-last)>2){ last=h; try{parent.postMessage({type:'height',value:h},'*');}catch(e){} }
  }
  window.addEventListener('load',report);
  window.addEventListener('resize',report);

  buildToggle(); buildCards();
})();
</script>
</body>
</html>
